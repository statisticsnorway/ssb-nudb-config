[datasets]

    [datasets.nasjprov]
        team = "utd-bhgskole"
        bucket = "nasjprov"
        path_glob = "nasjprov/klargjorte-data/nasjonaleprover_p[0-9][0-9][0-9][0-9]_p[0-9][0-9][0-9][0-9]_v*[0-9].parquet"

        variables = [
            # pers
            "snr",  
            "fnr",          

            # tid
            "utd_skoleaar_start", 

            # skole
            "orgnr_foretak",  
            "orgnrbed",
            "utd_skolekom",
            "skoletype_pas",

            # gro
            "gro_skolenavn_inn",
            "gro_avgiverskole_orgnrbed",
            "gro_avgiverskole_orgnr_foretak",
            "gro_avgiverskole_navn",

            # nasjprov
            'nasjprov_deltattstatus',
            'nasjprov_mestringsnivaa',
            'nasjprov_poeng',
            'nasjprov_skalapoeng',
            'nasjprov_provekode',
            'nasjprov_oppgavesettnr',
            'nasjprov_gruppenr',
            'nasjprov_skalapoeng_old',
            'nasjprov_mestringsnivaa_old',

            # derived
            "pers_kjoenn",
        ]

    

