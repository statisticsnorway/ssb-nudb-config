# Variables retrieved from baked datasets with one value per person.

[variables.utd_foerste_aar]
    unit = "tid"
    dtype = "STRING"
    length = [4]
    description_short = "Første år personen er registrert med utdanning."
    derived_from = ["snr"]
    derived_join_keys = ["snr"]
    derived_uses_datasets = ["utd_hoeyeste"]

[variables.utd_hoeyeste_dato]
    unit = "tid"
    dtype = "DATETIME"
    description_short = "Dato knyttet til personens høyeste utdanning."
    derived_from = ["snr"]
    derived_join_keys = ["snr"]
    derived_uses_datasets = ["utd_hoeyeste"]

[variables.utd_hoeyeste_aar]
